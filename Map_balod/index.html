<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balod – Free Map (Roads & Satellite)</title>

    <!-- Leaflet CSS + JS (free & open-source) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        /* ─── RESET & BODY ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 40%, #1a2a3a, #0b1117);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        /* ─── FLOATING CARD ─── */
        .floating-card {
            position: relative;
            width: 820px;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 24px 24px 28px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.06),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            animation: float 6s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-14px);
            }
        }

        .floating-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 48px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 50%, rgba(255, 255, 255, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ─── HEADER ─── */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .card-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .card-header h1 span {
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            margin-left: 8px;
            letter-spacing: 0.02em;
        }

        .badge {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
        }

        /* ─── MAP CONTAINER ─── */
        .map-wrapper {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: inset 0 4px 40px rgba(0, 0, 0, 0.5);
            background: #111;
        }

        #leafletMap {
            width: 100%;
            height: 520px;
            border-radius: 28px;
            background: #1a2632;
        }

        /* custom leaflet controls – subtle glass style */
        .leaflet-control-zoom a {
            background: rgba(20, 30, 45, 0.75) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            color: #e0f0ff !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
        }
        .leaflet-control-zoom a:hover {
            background: rgba(60, 120, 200, 0.4) !important;
        }
        .leaflet-control-attribution {
            background: rgba(0, 0, 0, 0.5) !important;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: rgba(255, 255, 255, 0.6) !important;
            border-radius: 20px 0 0 0 !important;
            padding: 4px 14px !important;
            font-size: 10px !important;
        }
        .leaflet-control-attribution a {
            color: rgba(180, 220, 255, 0.8) !important;
        }

        /* layer control tweaks */
        .leaflet-control-layers {
            background: rgba(16, 26, 40, 0.7) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            border-radius: 16px !important;
            padding: 8px 12px !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
        }
        .leaflet-control-layers label {
            color: #d0e4ff !important;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 0.02em;
        }
        .leaflet-control-layers input[type="radio"] {
            accent-color: #5aa9ff;
        }

        /* ─── OVERLAY INFO (on top of map) ─── */
        .map-overlay {
            position: absolute;
            bottom: 24px;
            left: 28px;
            right: 28px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            pointer-events: none;
            gap: 16px;
            flex-wrap: wrap;
            z-index: 500;
        }

        .map-overlay .district-label {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(0, 0, 0, 0.2);
            letter-spacing: -0.01em;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 20px 8px 20px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: auto;
        }

        .map-overlay .stats {
            display: flex;
            gap: 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 20px 8px 20px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: auto;
        }

        .map-overlay .stats span {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.02em;
        }

        .map-overlay .stats strong {
            font-weight: 600;
            color: #fff;
            margin-left: 4px;
        }

        /* ─── FOOTER ─── */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding: 0 4px;
        }

        .card-footer .credit {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
        }

        .card-footer .credit a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.1);
            transition: color 0.2s;
        }

        .card-footer .credit a:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .card-footer .coords {
            font-size: 11px;
            font-family: 'SF Mono', 'Menlo', monospace;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.04em;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 820px) {
            .floating-card {
                padding: 16px 16px 20px;
                border-radius: 32px;
                animation-duration: 8s;
            }
            #leafletMap {
                height: 380px;
            }
            .card-header h1 {
                font-size: 19px;
            }
            .card-header h1 span {
                font-size: 13px;
                margin-left: 4px;
            }
            .badge {
                font-size: 10px;
                padding: 4px 12px;
            }
            .map-overlay {
                bottom: 16px;
                left: 16px;
                right: 16px;
            }
            .map-overlay .district-label {
                font-size: 15px;
                padding: 4px 14px 6px 14px;
            }
            .map-overlay .stats {
                padding: 4px 14px 6px 14px;
                gap: 12px;
                flex-wrap: wrap;
            }
            .map-overlay .stats span {
                font-size: 10px;
            }
            .card-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
        }

        @media (max-width: 480px) {
            .floating-card {
                padding: 12px 12px 16px;
                border-radius: 24px;
            }
            .card-header {
                flex-wrap: wrap;
                gap: 8px;
            }
            .card-header h1 {
                font-size: 16px;
            }
            .card-header h1 span {
                font-size: 11px;
                display: block;
                margin-left: 0;
            }
            #leafletMap {
                height: 300px;
            }
            .map-overlay .district-label {
                font-size: 13px;
                padding: 3px 12px 5px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="floating-card">
        <!-- Header -->
        <div class="card-header">
            <h1>
                🗺️ Balod
                <span>Chhattisgarh</span>
            </h1>
            <div class="badge">Free layers</div>
        </div>

        <!-- Map -->
        <div class="map-wrapper">
            <div id="leafletMap"></div>

            <!-- Overlay (still visible, sitting above map) -->
            <div class="map-overlay">
                <div class="district-label">📍 Balod</div>
                <div class="stats">
                    <span>Area <strong>3,249 km²</strong></span>
                    <span>State <strong>C.G.</strong></span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="card-footer">
            <div class="credit">
                <a href="#" target="_blank">OpenStreetMap</a> &nbsp;·&nbsp;
                <a href="#" target="_blank">ESRI Satellite</a>
            </div>
            <div class="coords">81.0°E &nbsp; 20.7°N</div>
        </div>
    </div>

    <script>
        (function() {
            // ─── GeoJSON polygon for Balod (same coordinates) ───
            const geojsonData = {
                type: "Feature",
                geometry: {
                    type: "Polygon",
                    coordinates: [
                        [
                            [81.47208437694013, 20.87066677340983],
                            [81.42050312425289, 20.84990654083687],
                            [81.40484957625326, 20.94010255810977],
                            [81.42007386254562, 21.00635220310497],
                            [81.36557932905708, 21.038004402293033],
                            [81.22426333678403, 21.04689812596278],
                            [81.15484738390835, 21.076561011453496],
                            [81.1206880347768, 21.00461741229337],
                            [81.03299903768558, 20.995814581710114],
                            [80.97229889676476, 21.007374839079567],
                            [80.9406036983932, 20.977457613289438],
                            [80.97522586602825, 20.828856155922345],
                            [80.89509295542558, 20.80589271763955],
                            [80.82327428854296, 20.764644568875628],
                            [80.80321381157404, 20.72221124549754],
                            [80.86221387441222, 20.665452124601106],
                            [80.9532090048915, 20.639809425040262],
                            [81.00658127288207, 20.59829624782952],
                            [80.95419392264529, 20.54081228762229],
                            [80.99187853501363, 20.459290564777497],
                            [81.14920379759242, 20.37698347774269],
                            [81.25436809224875, 20.44756340807144],
                            [81.26358160467245, 20.50842965154173],
                            [81.3245131928626, 20.562795315460125],
                            [81.3865921446678, 20.533393106470207],
                            [81.41036241819731, 20.554432810242265],
                            [81.49372304348584, 20.602573101161607],
                            [81.51608857627083, 20.713558038749824],
                            [81.47856206084373, 20.776063631914983],
                            [81.51703332811586, 20.827760093574327],
                            [81.47208437694013, 20.87066677340983]
                        ]
                    ]
                }
            };

            // ─── Initialize map ───
            const map = L.map('leafletMap', {
                center: [20.78, 81.05],
                zoom: 10,
                zoomControl: true,
                fadeAnimation: true,
                zoomAnimation: true,
                attributionControl: true
            });

            // ─── Base layers (free) ───

            // 1. OpenStreetMap (roads / standard)
            const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            });

            // 2. ESRI Satellite (free for non‑commercial)
            const satelliteLayer = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://esri.com">ESRI</a> &amp; contributors'
                }
            );

            // 3. (Bonus) OpenStreetMap "Humanitarian" – slightly different style
            const osmHumanitarian = L.tileLayer(
                'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://openstreetmap.fr/hot">OSM Humanitarian</a>'
                }
            );

            // ─── Add default layer ───
            osmLayer.addTo(map);

            // ─── Layer control ───
            const baseMaps = {
                "🗺️ Roads (OSM)": osmLayer,
                "🛰️ Satellite (ESRI)": satelliteLayer,
                "🧭 Humanitarian (OSM)": osmHumanitarian
            };
            L.control.layers(baseMaps, null, {
                position: 'topright',
                collapsed: false
            }).addTo(map);

            // ─── Draw Balod polygon ───
            const polygonStyle = {
                color: '#6bc9ff',
                weight: 3,
                opacity: 0.85,
                fillColor: '#1a6bb0',
                fillOpacity: 0.25,
                smoothFactor: 1,
                dashArray: null,
                lineCap: 'round',
                lineJoin: 'round'
            };

            const balodLayer = L.geoJSON(geojsonData, {
                style: polygonStyle,
                onEachFeature: function(feature, layer) {
                    // Bind a simple popup
                    layer.bindPopup(`
                            <strong>Balod District</strong><br>
                            Chhattisgarh, India<br>
                            Area: ~3,249 km²
                        `, {
                        className: 'custom-popup',
                        offset: [0, -8]
                    });
                    // Optional: highlight on hover
                    layer.on('mouseover', function() {
                        this.setStyle({
                            weight: 4,
                            color: '#8ad4ff',
                            fillOpacity: 0.35
                        });
                        this.bringToFront();
                    });
                    layer.on('mouseout', function() {
                        this.setStyle(polygonStyle);
                    });
                }
            }).addTo(map);

            // ─── Fit map to polygon bounds ───
            map.fitBounds(balodLayer.getBounds(), {
                padding: [40, 40],
                maxZoom: 13
            });

            // ─── Add a small marker at centroid (optional) ───
            const centroid = [20.76, 81.06]; // approximate
            const marker = L.circleMarker(centroid, {
                radius: 5,
                color: '#fff',
                weight: 1,
                opacity: 0.9,
                fillColor: '#5aa9ff',
                fillOpacity: 0.8,
                pulsating: true
            }).addTo(map);
            marker.bindPopup('Balod · district centre', {
                offset: [0, -12]
            });

            // ─── Custom CSS for popup ───
            const style = document.createElement('style');
            style.textContent = `
                    .custom-popup .leaflet-popup-content-wrapper {
                        background: rgba(10, 20, 35, 0.85);
                        backdrop-filter: blur(12px);
                        -webkit-backdrop-filter: blur(12px);
                        border: 1px solid rgba(255,255,255,0.08);
                        border-radius: 16px;
                        color: #eaf4ff;
                        font-family: 'Inter', system-ui, sans-serif;
                        box-shadow: 0 12px 48px rgba(0,0,0,0.6);
                    }
                    .custom-popup .leaflet-popup-tip {
                        background: rgba(10, 20, 35, 0.85);
                        border: 1px solid rgba(255,255,255,0.08);
                    }
                    .custom-popup .leaflet-popup-content {
                        padding: 8px 12px;
                        font-size: 14px;
                        line-height: 1.6;
                    }
                    .custom-popup strong {
                        color: #8acbff;
                        font-weight: 600;
                    }
                `;
            document.head.appendChild(style);

            // ─── Fix for zoom control overlap with layer control ───
            // (just a small visual tweak)
            setTimeout(() => {
                const zoomControl = document.querySelector('.leaflet-control-zoom');
                if (zoomControl) {
                    zoomControl.style.marginTop = '8px';
                }
            }, 100);

            // ─── Handle resize ───
            window.addEventListener('resize', () => {
                map.invalidateSize();
            });

            console.log('🗺️ Balod map with free layers (OSM, ESRI Satellite) loaded.');
        })();
    </script>

</body>
</html>
