<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balod District Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
        /* ─── RESET & BASE ─── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 40%, #1a2a3a, #0b1117);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        /* ─── FLOATING CARD ─── */
        .floating-card {
            position: relative;
            width: 760px;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 28px 28px 32px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.06),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: transform 0.3s ease, box-shadow 0.4s ease;
            animation: float 6s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-14px);
            }
        }

        /* subtle shimmer overlay */
        .floating-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 48px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 50%, rgba(255, 255, 255, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ─── HEADER ─── */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding: 0 6px;
        }

        .card-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .card-header h1 span {
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            margin-left: 8px;
            letter-spacing: 0.02em;
        }

        .badge {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
        }

        /* ─── MAP WRAPPER ─── */
        .map-wrapper {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 60%, #1e3347, #0d1823);
            box-shadow: inset 0 4px 40px rgba(0, 0, 0, 0.5);
        }

        .map-wrapper canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 700 / 520;
            border-radius: 28px;
            cursor: default;
            transition: filter 0.3s ease;
        }

        .map-wrapper canvas:hover {
            filter: brightness(1.04);
        }

        /* ─── MAP OVERLAY INFO ─── */
        .map-overlay {
            position: absolute;
            bottom: 24px;
            left: 28px;
            right: 28px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            pointer-events: none;
            gap: 16px;
            flex-wrap: wrap;
        }

        .map-overlay .district-label {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 0, 0, 0.2);
            letter-spacing: -0.01em;
            line-height: 1.2;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 18px 8px 18px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .map-overlay .stats {
            display: flex;
            gap: 20px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 18px 8px 18px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .map-overlay .stats span {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.02em;
        }

        .map-overlay .stats strong {
            font-weight: 600;
            color: #fff;
            margin-left: 4px;
        }

        /* ─── FOOTER ─── */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding: 0 6px;
        }

        .card-footer .credit {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .card-footer .credit a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.1);
            transition: color 0.2s;
        }

        .card-footer .credit a:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .card-footer .coords {
            font-size: 11px;
            font-family: 'SF Mono', 'Menlo', monospace;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.04em;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 820px) {
            .floating-card {
                padding: 18px 18px 22px;
                border-radius: 32px;
                animation-duration: 8s;
            }
            .floating-card::before {
                border-radius: 32px;
            }
            .card-header h1 {
                font-size: 19px;
            }
            .card-header h1 span {
                font-size: 13px;
                margin-left: 4px;
            }
            .badge {
                font-size: 10px;
                padding: 4px 12px;
            }
            .map-wrapper {
                border-radius: 20px;
            }
            .map-wrapper canvas {
                aspect-ratio: 700 / 520;
                border-radius: 20px;
            }
            .map-overlay {
                bottom: 16px;
                left: 16px;
                right: 16px;
                gap: 10px;
            }
            .map-overlay .district-label {
                font-size: 15px;
                padding: 4px 14px 6px 14px;
            }
            .map-overlay .stats {
                padding: 4px 14px 6px 14px;
                gap: 12px;
                flex-wrap: wrap;
            }
            .map-overlay .stats span {
                font-size: 10px;
            }
            .card-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .card-footer .credit {
                font-size: 11px;
            }
            .card-footer .coords {
                font-size: 10px;
            }
        }

        @media (max-width: 480px) {
            .floating-card {
                padding: 12px 12px 16px;
                border-radius: 24px;
            }
            .card-header {
                flex-wrap: wrap;
                gap: 8px;
            }
            .card-header h1 {
                font-size: 16px;
            }
            .card-header h1 span {
                font-size: 11px;
                display: block;
                margin-left: 0;
            }
            .badge {
                font-size: 9px;
                padding: 3px 10px;
            }
            .map-overlay .district-label {
                font-size: 13px;
                padding: 3px 12px 5px 12px;
            }
            .map-overlay .stats span {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>

    <div class="floating-card">
        <!-- Header -->
        <div class="card-header">
            <h1>
                🗺️ Balod
                <span>Chhattisgarh</span>
            </h1>
            <div class="badge">District</div>
        </div>

        <!-- Map -->
        <div class="map-wrapper">
            <canvas id="mapCanvas" width="700" height="520"></canvas>
            <div class="map-overlay">
                <div class="district-label">📍 Balod</div>
                <div class="stats">
                    <span>Area <strong>3,249 km²</strong></span>
                    <span>State <strong>C.G.</strong></span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="card-footer">
            <div class="credit">District boundary &bull; Chhattisgarh</div>
            <div class="coords">81.0°E &nbsp; 20.7°N</div>
        </div>
    </div>

    <script>
        (function() {
            // ─── GeoJSON polygon for Balod ───
            const coordinates = [
                [
                    [81.47208437694013, 20.87066677340983],
                    [81.42050312425289, 20.84990654083687],
                    [81.40484957625326, 20.94010255810977],
                    [81.42007386254562, 21.00635220310497],
                    [81.36557932905708, 21.038004402293033],
                    [81.22426333678403, 21.04689812596278],
                    [81.15484738390835, 21.076561011453496],
                    [81.1206880347768, 21.00461741229337],
                    [81.03299903768558, 20.995814581710114],
                    [80.97229889676476, 21.007374839079567],
                    [80.9406036983932, 20.977457613289438],
                    [80.97522586602825, 20.828856155922345],
                    [80.89509295542558, 20.80589271763955],
                    [80.82327428854296, 20.764644568875628],
                    [80.80321381157404, 20.72221124549754],
                    [80.86221387441222, 20.665452124601106],
                    [80.9532090048915, 20.639809425040262],
                    [81.00658127288207, 20.59829624782952],
                    [80.95419392264529, 20.54081228762229],
                    [80.99187853501363, 20.459290564777497],
                    [81.14920379759242, 20.37698347774269],
                    [81.25436809224875, 20.44756340807144],
                    [81.26358160467245, 20.50842965154173],
                    [81.3245131928626, 20.562795315460125],
                    [81.3865921446678, 20.533393106470207],
                    [81.41036241819731, 20.554432810242265],
                    [81.49372304348584, 20.602573101161607],
                    [81.51608857627083, 20.713558038749824],
                    [81.47856206084373, 20.776063631914983],
                    [81.51703332811586, 20.827760093574327],
                    [81.47208437694013, 20.87066677340983]
                ]
            ];

            // ─── Canvas setup ───
            const canvas = document.getElementById('mapCanvas');
            const ctx = canvas.getContext('2d');

            // Physical canvas size (CSS will scale it)
            const W = 700;
            const H = 520;
            canvas.width = W;
            canvas.height = H;

            // ─── Compute bounds ───
            const pts = coordinates[0];
            let minLon = Infinity,
                maxLon = -Infinity;
            let minLat = Infinity,
                maxLat = -Infinity;

            for (const p of pts) {
                const lon = p[0];
                const lat = p[1];
                if (lon < minLon) minLon = lon;
                if (lon > maxLon) maxLon = lon;
                if (lat < minLat) minLat = lat;
                if (lat > maxLat) maxLat = lat;
            }

            // Add padding (5%)
            const padLon = (maxLon - minLon) * 0.05;
            const padLat = (maxLat - minLat) * 0.05;
            minLon -= padLon;
            maxLon += padLon;
            minLat -= padLat;
            maxLat += padLat;

            const lonRange = maxLon - minLon;
            const latRange = maxLat - minLat;

            // ─── Transformation ───
            function toPixel(lon, lat) {
                // Preserve aspect ratio, fit inside canvas with some margin
                const margin = 32;
                const availW = W - margin * 2;
                const availH = H - margin * 2;

                // Choose scale to fit both dimensions
                const scale = Math.min(availW / lonRange, availH / latRange);

                const offsetX = (availW - lonRange * scale) / 2 + margin;
                const offsetY = (availH - latRange * scale) / 2 + margin;

                const x = (lon - minLon) * scale + offsetX;
                const y = (maxLat - lat) * scale + offsetY; // invert y
                return { x, y };
            }

            // ─── Render ───
            function render() {
                ctx.clearRect(0, 0, W, H);

                // --- 1. subtle background glow ---
                const grad = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, 420);
                grad.addColorStop(0, 'rgba(60, 130, 200, 0.04)');
                grad.addColorStop(0.5, 'rgba(40, 90, 160, 0.02)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // --- 2. draw the polygon ---
                const pixelPts = pts.map(p => toPixel(p[0], p[1]));

                // shadow / glow layer
                ctx.save();
                ctx.shadowColor = 'rgba(100, 200, 255, 0.15)';
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.moveTo(pixelPts[0].x, pixelPts[0].y);
                for (let i = 1; i < pixelPts.length; i++) {
                    ctx.lineTo(pixelPts[i].x, pixelPts[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = 'rgba(60, 150, 220, 0.05)';
                ctx.fill();
                ctx.restore();

                // main fill with gradient
                const fillGrad = ctx.createLinearGradient(0, 0, W * 0.6, H);
                fillGrad.addColorStop(0, 'rgba(30, 144, 220, 0.55)');
                fillGrad.addColorStop(0.5, 'rgba(20, 100, 180, 0.50)');
                fillGrad.addColorStop(1, 'rgba(10, 60, 130, 0.45)');

                ctx.beginPath();
                ctx.moveTo(pixelPts[0].x, pixelPts[0].y);
                for (let i = 1; i < pixelPts.length; i++) {
                    ctx.lineTo(pixelPts[i].x, pixelPts[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = fillGrad;
                ctx.fill();

                // inner highlight (subtle)
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(pixelPts[0].x, pixelPts[0].y);
                for (let i = 1; i < pixelPts.length; i++) {
                    ctx.lineTo(pixelPts[i].x, pixelPts[i].y);
                }
                ctx.closePath();
                ctx.clip();

                const hl = ctx.createRadialGradient(W * 0.3, H * 0.25, 10, W * 0.3, H * 0.25, 300);
                hl.addColorStop(0, 'rgba(255,255,255,0.06)');
                hl.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = hl;
                ctx.fillRect(0, 0, W, H);
                ctx.restore();

                // stroke with glow
                ctx.save();
                ctx.shadowColor = 'rgba(100, 210, 255, 0.25)';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.moveTo(pixelPts[0].x, pixelPts[0].y);
                for (let i = 1; i < pixelPts.length; i++) {
                    ctx.lineTo(pixelPts[i].x, pixelPts[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(140, 220, 255, 0.7)';
                ctx.lineWidth = 2.2;
                ctx.stroke();
                ctx.restore();

                // outer subtle stroke
                ctx.beginPath();
                ctx.moveTo(pixelPts[0].x, pixelPts[0].y);
                for (let i = 1; i < pixelPts.length; i++) {
                    ctx.lineTo(pixelPts[i].x, pixelPts[i].y);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.lineWidth = 0.8;
                ctx.stroke();

                // --- 3. decorative dots on vertices (subtle) ---
                for (const p of pixelPts) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(180, 230, 255, 0.3)';
                    ctx.fill();
                }

                // --- 4. centroid marker ---
                let cx = 0,
                    cy = 0;
                for (const p of pixelPts) {
                    cx += p.x;
                    cy += p.y;
                }
                cx /= pixelPts.length;
                cy /= pixelPts.length;

                // outer ring
                const pulse = Date.now() / 1200;
                const rad = 10 + 3 * Math.sin(pulse);
                ctx.save();
                ctx.shadowColor = 'rgba(100, 200, 255, 0.35)';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(cx, cy, rad, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(180, 230, 255, 0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.restore();

                // inner dot
                ctx.beginPath();
                ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(180, 235, 255, 0.7)';
                ctx.fill();
                ctx.shadowColor = 'rgba(100, 200, 255, 0.2)';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(cx, cy, 1.8, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.shadowBlur = 0;

                // --- 5. subtle grid lines (very faint) ---
                ctx.save();
                ctx.globalAlpha = 0.04;
                ctx.strokeStyle = '#8af';
                ctx.lineWidth = 0.5;
                for (let i = 0; i <= 8; i++) {
                    const x = margin + (i / 8) * (W - margin * 2);
                    ctx.beginPath();
                    ctx.moveTo(x, margin);
                    ctx.lineTo(x, H - margin);
                    ctx.stroke();
                }
                for (let i = 0; i <= 6; i++) {
                    const y = margin + (i / 6) * (H - margin * 2);
                    ctx.beginPath();
                    ctx.moveTo(margin, y);
                    ctx.lineTo(W - margin, y);
                    ctx.stroke();
                }
                ctx.restore();

                // --- 6. watermark text (very subtle) ---
                ctx.save();
                ctx.globalAlpha = 0.04;
                ctx.fillStyle = '#fff';
                ctx.font = '10px "Inter", sans-serif';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText('Balod · Chhattisgarh', W - 20, H - 16);
                ctx.restore();

                // --- 7. animate pulse ---
                requestAnimationFrame(render);
            }

            render();

            // ─── Handle resize ───
            function handleResize() {
                // The canvas CSS handles scaling; no need to re-render
            }
            window.addEventListener('resize', handleResize);

            // ─── Tooltip / hover effect (optional) ───
            canvas.addEventListener('mousemove', (e) => {
                // just a subtle cursor change
                canvas.style.cursor = 'default';
            });

            console.log('🗺️ Balod district map rendered');
        })();
    </script>

</body>
</html>
