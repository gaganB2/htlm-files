<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A premium motivational quote experience."
    />
    <link rel="icon" type="image/x-icon" href="qsvg.svg">
    <title>Sky Quote</title>

    <style>
      /* =====================================================
           DESIGN TOKENS
        ===================================================== */

      :root {
        --navy: #06152f;

        --blue-dark: #0a2e5c;

        --blue: #0b4d8c;

        --blue-light: #69b5ea;

        --white: #ffffff;

        --white-soft: rgba(255, 255, 255, 0.68);

        --white-muted: rgba(255, 255, 255, 0.42);

        --yellow: #ffd76a;

        --yellow-soft: rgba(255, 215, 106, 0.35);

        --glass: rgba(255, 255, 255, 0.1);

        --glass-light: rgba(255, 255, 255, 0.16);

        --border: rgba(255, 255, 255, 0.2);
      }

      /* =====================================================
           RESET
        ===================================================== */

      *,
      *::before,
      *::after {
        margin: 0;

        padding: 0;

        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;

        overflow-x: hidden;

        overflow-y: auto;

        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        color: var(--white);

        background:
          radial-gradient(
            circle at 18% 12%,
            rgba(94, 176, 239, 0.42),
            transparent 34%
          ),
          radial-gradient(
            circle at 82% 82%,
            rgba(255, 215, 106, 0.09),
            transparent 28%
          ),
          linear-gradient(
            145deg,
            var(--navy) 0%,
            var(--blue-dark) 52%,
            var(--blue-light) 140%
          );
      }

      button,
      a {
        font: inherit;
      }

      button {
        border: 0;
      }

      /* =====================================================
           ATMOSPHERIC BACKGROUND
        ===================================================== */

      .scene {
        position: fixed;

        inset: 0;

        z-index: 0;

        overflow: hidden;

        pointer-events: none;

        perspective: 1200px;
      }

      /* =====================================================
           LIGHT
        ===================================================== */

      .sun {
        position: absolute;

        width: 260px;

        height: 260px;

        top: 7%;

        right: 8%;

        border-radius: 50%;

        background: radial-gradient(
          circle,
          rgba(255, 241, 179, 0.98) 0%,
          rgba(255, 215, 106, 0.65) 25%,
          rgba(255, 215, 106, 0.13) 60%,
          transparent 72%
        );

        filter: blur(2px);

        opacity: 0.72;

        animation: sunFloat 9s ease-in-out infinite;
      }

      @keyframes sunFloat {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }

        50% {
          transform: translate3d(0, -15px, 0) scale(1.04);
        }
      }

      /* =====================================================
           HORIZON
        ===================================================== */

      .horizon {
        position: absolute;

        left: -10%;

        bottom: -25%;

        width: 120%;

        height: 55%;

        background: radial-gradient(
          ellipse at center,
          rgba(255, 255, 255, 0.25),
          transparent 65%
        );

        filter: blur(55px);

        opacity: 0.45;
      }

      /* =====================================================
           CLOUDS
        ===================================================== */

      .cloud {
        position: absolute;

        width: 360px;

        height: 105px;

        border-radius: 100px;

        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.96),
          rgba(220, 239, 253, 0.68)
        );

        filter: blur(1px) drop-shadow(0 30px 30px rgba(0, 25, 70, 0.18));

        opacity: 0.6;

        transform-style: preserve-3d;

        animation: cloudFloat 15s ease-in-out infinite;
      }

      .cloud::before,
      .cloud::after {
        content: "";

        position: absolute;

        border-radius: 50%;

        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.98),
          rgba(225, 242, 255, 0.72)
        );
      }

      .cloud::before {
        width: 155px;

        height: 155px;

        left: 55px;

        bottom: 22px;
      }

      .cloud::after {
        width: 118px;

        height: 118px;

        right: 60px;

        bottom: 20px;
      }

      .cloud-one {
        top: 13%;

        left: -120px;

        transform: scale(0.9) translateZ(-100px);
      }

      .cloud-two {
        right: -140px;

        bottom: 10%;

        transform: scale(1.25) translateZ(-200px);

        opacity: 0.38;

        animation-delay: -5s;
      }

      .cloud-three {
        left: 15%;

        bottom: -60px;

        transform: scale(0.65) translateZ(-300px);

        opacity: 0.22;

        animation-delay: -9s;
      }

      @keyframes cloudFloat {
        0%,
        100% {
          margin-left: 0;

          margin-top: 0;
        }

        50% {
          margin-left: 30px;

          margin-top: -18px;
        }
      }

      /* =====================================================
           PARTICLES
        ===================================================== */

      .particle {
        position: absolute;

        width: 4px;

        height: 4px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.65);

        box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);

        animation: particleFloat var(--duration) ease-in-out infinite;
      }

      .particle-one {
        left: 12%;

        top: 35%;

        --x: 20px;

        --duration: 5s;
      }

      .particle-two {
        left: 78%;

        top: 28%;

        --x: -25px;

        --duration: 7s;
      }

      .particle-three {
        left: 66%;

        top: 70%;

        --x: 15px;

        --duration: 6s;
      }

      .particle-four {
        left: 25%;

        top: 72%;

        --x: -15px;

        --duration: 8s;
      }

      @keyframes particleFloat {
        0%,
        100% {
          transform: translate3d(0, 0, 0);

          opacity: 0.2;
        }

        50% {
          transform: translate3d(var(--x), -70px, 0);

          opacity: 0.8;
        }
      }

      /* =====================================================
           PAGE
        ===================================================== */

      .page {
        position: relative;

        z-index: 5;
      }

      /* =====================================================
           HERO
        ===================================================== */

      .hero {
        position: relative;

        min-height: 100svh;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 110px 24px 100px;
      }

      /* =====================================================
           QUOTE CARD
        ===================================================== */

      .quote-card {
        position: relative;

        width: min(820px, 100%);

        padding: 62px 70px 45px;

        border: 1px solid var(--border);

        border-radius: 34px;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.16),
          rgba(255, 255, 255, 0.055)
        );

        -webkit-backdrop-filter: blur(24px) saturate(125%);

        backdrop-filter: blur(24px) saturate(125%);

        box-shadow:
          0 50px 100px rgba(0, 15, 50, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.25),
          inset 0 -1px 0 rgba(0, 20, 60, 0.15);

        transform-style: preserve-3d;

        will-change: transform;

        transition: transform 0.18s ease-out;
      }

      /* =====================================================
           CARD LIGHT
        ===================================================== */

      .quote-card::before {
        content: "";

        position: absolute;

        inset: 1px;

        border-radius: 33px;

        background: radial-gradient(
          circle at 30% 0%,
          rgba(255, 255, 255, 0.2),
          transparent 36%
        );

        pointer-events: none;
      }

      /* =====================================================
           TOP LABEL
        ===================================================== */

      .label {
        position: relative;

        display: flex;

        align-items: center;

        gap: 11px;

        margin-bottom: 30px;

        color: var(--white-soft);

        font-size: 11px;

        font-weight: 700;

        letter-spacing: 0.2em;

        text-transform: uppercase;
      }

      .label-dot {
        width: 7px;

        height: 7px;

        flex: 0 0 auto;

        border-radius: 50%;

        background: var(--yellow);

        box-shadow: 0 0 18px var(--yellow-soft);
      }

      /* =====================================================
           QUOTE
        ===================================================== */

      .quote {
        position: relative;

        max-width: 720px;

        font-size: clamp(1.9rem, 4vw, 3.6rem);

        line-height: 1.18;

        letter-spacing: -0.045em;

        font-weight: 600;

        color: var(--white);

        overflow-wrap: anywhere;

        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
      }

      /* Safe quote mark.
           It is now part of normal document flow. */

      .quote::before {
        content: "“";

        display: block;

        height: 34px;

        margin-bottom: 4px;

        color: var(--yellow);

        font-family: Georgia, serif;

        font-size: 58px;

        line-height: 1;

        opacity: 0.82;
      }

      .quote.loading {
        opacity: 0.45;

        transform: translateY(4px);
      }

      /* =====================================================
           AUTHOR
        ===================================================== */

      .author {
        position: relative;

        margin-top: 30px;

        padding-left: 24px;

        color: var(--white-soft);

        font-size: 14px;

        line-height: 1.5;
      }

      .author::before {
        content: "";

        position: absolute;

        left: 0;

        top: 0.65em;

        width: 12px;

        height: 1px;

        background: var(--yellow);
      }

      /* =====================================================
           ACTION AREA
        ===================================================== */

      .actions {
        position: relative;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 20px;

        margin-top: 45px;

        padding-top: 25px;

        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .hint {
        color: var(--white-muted);

        font-size: 11px;

        line-height: 1.5;
      }

      /* =====================================================
           BUTTON
        ===================================================== */

      .new-quote {
        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 12px;

        flex: 0 0 auto;

        min-height: 44px;

        padding: 11px 19px;

        border: 1px solid rgba(255, 255, 255, 0.18);

        border-radius: 100px;

        background: rgba(255, 255, 255, 0.08);

        color: var(--white);

        font-size: 12px;

        font-weight: 600;

        cursor: pointer;

        transition:
          transform 0.3s ease,
          background 0.3s ease,
          border-color 0.3s ease;
      }

      .new-quote:hover {
        transform: translateY(-3px);

        background: rgba(255, 255, 255, 0.16);

        border-color: rgba(255, 255, 255, 0.36);
      }

      .new-quote:active {
        transform: translateY(-1px) scale(0.98);
      }

      .arrow {
        color: var(--yellow);

        font-size: 17px;

        transition: transform 0.3s ease;
      }

      .new-quote:hover .arrow {
        transform: translateX(4px);
      }

      /* =====================================================
           SCROLL INDICATOR
        ===================================================== */

      .scroll-hint {
        position: absolute;

        left: 50%;

        bottom: 24px;

        display: flex;

        flex-direction: column;

        align-items: center;

        gap: 7px;

        transform: translateX(-50%);

        color: rgba(255, 255, 255, 0.48);

        font-size: 10px;

        font-weight: 600;

        letter-spacing: 0.16em;

        text-transform: uppercase;
      }

      .scroll-arrow {
        color: var(--yellow);

        font-size: 17px;

        animation: scrollArrow 1.8s ease-in-out infinite;
      }

      @keyframes scrollArrow {
        0%,
        100% {
          transform: translateY(0);

          opacity: 0.45;
        }

        50% {
          transform: translateY(7px);

          opacity: 1;
        }
      }

      /* =====================================================
           NEXT SECTION
        ===================================================== */

      .next-section {
        position: relative;

        min-height: 100svh;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 100px 24px;

        background: linear-gradient(
          180deg,
          rgba(6, 21, 47, 0.05),
          rgba(4, 14, 32, 0.75)
        );
      }

      .next-content {
        width: min(900px, 100%);

        text-align: center;
      }

      .next-label {
        margin-bottom: 20px;

        color: var(--yellow);

        font-size: 11px;

        font-weight: 700;

        letter-spacing: 0.2em;

        text-transform: uppercase;
      }

      .next-title {
        color: var(--white);

        font-size: clamp(2.5rem, 7vw, 6rem);

        line-height: 0.95;

        letter-spacing: -0.06em;

        font-weight: 650;
      }

      .next-description {
        max-width: 500px;

        margin: 28px auto 0;

        color: var(--white-soft);

        font-size: 15px;

        line-height: 1.7;
      }

      /* =====================================================
           RESPONSIVE
        ===================================================== */

      @media (max-width: 700px) {
        .hero {
          min-height: auto;

          padding: 70px 16px 100px;
        }

        .quote-card {
          padding: 44px 26px 32px;

          border-radius: 25px;
        }

        .quote-card::before {
          border-radius: 24px;
        }

        .label {
          margin-bottom: 25px;
        }

        .quote {
          font-size: clamp(1.8rem, 8.5vw, 2.7rem);

          line-height: 1.18;
        }

        .quote::before {
          height: 28px;

          margin-bottom: 2px;

          font-size: 48px;
        }

        .author {
          margin-top: 25px;
        }

        .actions {
          align-items: flex-start;

          flex-direction: column;

          margin-top: 35px;
        }

        .hint {
          display: none;
        }

        .new-quote {
          width: 100%;
        }

        .scroll-hint {
          display: none;
        }

        .sun {
          width: 190px;

          height: 190px;

          right: -70px;

          top: 5%;
        }

        .cloud {
          opacity: 0.35;
        }

        .next-section {
          min-height: 80svh;
        }
      }

      /* =====================================================
           REDUCED MOTION
        ===================================================== */

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .sun,
        .cloud,
        .particle,
        .scroll-arrow {
          animation: none;
        }

        .quote-card {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
         ATMOSPHERE
    ===================================================== -->

    <div class="scene">
      <div class="sun"></div>

      <div class="horizon"></div>

      <div class="cloud cloud-one"></div>

      <div class="cloud cloud-two"></div>

      <div class="cloud cloud-three"></div>

      <div class="particle particle-one"></div>

      <div class="particle particle-two"></div>

      <div class="particle particle-three"></div>

      <div class="particle particle-four"></div>
    </div>

    <!-- =====================================================
         PAGE CONTENT
    ===================================================== -->

    <div class="page">
      <!-- =================================================
             HERO
        ================================================= -->

      <section class="hero">
        <article class="quote-card" id="quoteCard">
          <div class="label">
            <span class="label-dot"></span>

            Daily Perspective
          </div>

          <div class="quote" id="quote">Loading inspiration...</div>

          <div class="author" id="author">—</div>

          <div class="actions">
            <span class="hint">
              A little perspective can change everything.
            </span>

            <button class="new-quote" id="newQuote" type="button">
              New thought

              <span class="arrow" aria-hidden="true"> → </span>
            </button>
          </div>
        </article>

        <div class="scroll-hint">
          <span> Scroll to explore </span>

          <span class="scroll-arrow" aria-hidden="true"> ↓ </span>
        </div>
      </section>

      <!-- =================================================
             NEXT SECTION
        ================================================= -->

      <section class="next-section" id="next">
        <div class="next-content">
          <div class="next-label">Keep going</div>

          <h2 class="next-title">
            Your next
            <br />
            perspective.
          </h2>

          <p class="next-description">
            Every new thought gives you another way to see the world. Keep
            exploring.
          </p>
        </div>
      </section>
    </div>

    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>
      /* =================================================
           ELEMENTS
        ================================================= */

      const quoteElement = document.getElementById("quote");

      const authorElement = document.getElementById("author");

      const button = document.getElementById("newQuote");

      const card = document.getElementById("quoteCard");

      /* =================================================
           ESCAPE API CONTENT
        ================================================= */

      function escapeHTML(value) {
        const element = document.createElement("div");

        element.textContent = value ?? "";

        return element.innerHTML;
      }

      /* =================================================
           LOAD QUOTE
        ================================================= */

      async function getQuote() {
        quoteElement.classList.add("loading");

        authorElement.textContent = "Loading...";

        try {
          const response = await fetch(
            "https://quoteslate.vercel.app/api/quotes/random",
            {
              method: "GET",
              headers: {
                Accept: "application/json",
              },
            },
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          console.log("Quote API response:", data);

          const quote = Array.isArray(data) ? data[0] : data;

          if (!quote || !quote.quote) {
            throw new Error("Unexpected API response");
          }

          quoteElement.innerHTML =
            '<span class="quote-mark-hidden" aria-hidden="true"></span>' +
            escapeHTML(quote.quote);

          authorElement.textContent = quote.author || "Unknown";
        } catch (error) {
          console.error("Quote API error:", error);

          /*
                    Fallback quote.

                    The application still works
                    even if the external API is
                    temporarily unavailable.
                */

          quoteElement.textContent = "The future depends on what you do today.";

          authorElement.textContent = "— Mahatma Gandhi";
        } finally {
          quoteElement.classList.remove("loading");
        }
      }

      /* =================================================
           BUTTON
        ================================================= */

      button.addEventListener("click", getQuote);

      /* =================================================
           3D CARD PARALLAX
        ================================================= */

      const supportsHover = window.matchMedia(
        "(hover: hover) and (pointer: fine)",
      ).matches;

      if (supportsHover) {
        document.addEventListener("mousemove", (event) => {
          const x = event.clientX / window.innerWidth;

          const y = event.clientY / window.innerHeight;

          const rotateX = (0.5 - y) * 3;

          const rotateY = (x - 0.5) * 4;

          card.style.transform = `perspective(1200px)
                         rotateX(${rotateX}deg)
                         rotateY(${rotateY}deg)
                         translateY(-4px)`;
        });

        card.addEventListener("mouseleave", () => {
          card.style.transform =
            "perspective(1200px) rotateX(0deg) rotateY(0deg) translateY(0)";
        });
      }

      /* =================================================
           INITIAL QUOTE
        ================================================= */

      getQuote();
    </script>
  </body>
</html>
