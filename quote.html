<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Fixes the Edge meta-viewport warning -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quote API</title>
  </head>

  <body>
    <h1>Random Quote</h1>

    <p id="quote">Loading...</p>

    <p id="author"></p>

    <button id="button">Get New Quote</button>

    <script>
      const quoteElement = document.getElementById("quote");

      const authorElement = document.getElementById("author");

      const button = document.getElementById("button");

      async function getQuote() {
        quoteElement.textContent = "Loading...";
        authorElement.textContent = "";

        try {
          const response = await fetch(
            "https://quoteslate.vercel.app/api/quotes/random",
          );

          if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
          }

          const data = await response.json();

          console.log("API Response:", data);

          /*QuoteSlate can return quote data in an array take the first quote. */

          const quote = Array.isArray(data) ? data[0] : data;

          quoteElement.textContent = '"' + quote.quote + '"';

          authorElement.textContent = "— " + quote.author;
        } catch (error) {
          console.error("API Error:", error);

          quoteElement.textContent = "Could not load quote.";

          authorElement.textContent = "Check the browser console.";
        }
      }

      button.addEventListener("click", getQuote);

      // Load a quote automatically
      getQuote();
    </script>
  </body>
</html>
