<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sky Quotes</title>

    <style>
      /* =====================================================
           DESIGN SYSTEM
        ===================================================== */

      :root {
        --sky-deep: #071b3a;
        --sky-blue: #0b3d78;
        --sky-light: #5da9e9;

        --white: #ffffff;
        --white-soft: rgba(255, 255, 255, 0.72);

        --gold: #ffd76a;
        --gold-soft: rgba(255, 215, 106, 0.35);

        --glass: rgba(255, 255, 255, 0.1);

        --border: rgba(255, 255, 255, 0.22);

        --shadow: rgba(0, 15, 45, 0.35);
      }

      /* =====================================================
           RESET
        ===================================================== */

      * {
        margin: 0;
        padding: 0;

        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;

        overflow: hidden;

        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        color: var(--white);

        background:
          radial-gradient(
            circle at 20% 10%,
            rgba(91, 173, 240, 0.45),
            transparent 35%
          ),
          radial-gradient(
            circle at 85% 80%,
            rgba(255, 215, 106, 0.1),
            transparent 30%
          ),
          linear-gradient(145deg, #06152f, #0b3970 55%, #5aa4dc);
      }

      /* =====================================================
           ATMOSPHERE
        ===================================================== */

      .scene {
        position: fixed;

        inset: 0;

        overflow: hidden;

        perspective: 1200px;
      }

      /* Horizon */

      .horizon {
        position: absolute;

        left: -10%;

        bottom: -25%;

        width: 120%;

        height: 55%;

        background: radial-gradient(
          ellipse at center,
          rgba(255, 255, 255, 0.28),
          transparent 65%
        );

        filter: blur(50px);

        opacity: 0.45;
      }

      /* =====================================================
           SUN
        ===================================================== */

      .sun {
        position: absolute;

        width: 240px;

        height: 240px;

        right: 9%;

        top: 10%;

        border-radius: 50%;

        background: radial-gradient(
          circle,
          rgba(255, 239, 170, 1) 0%,
          rgba(255, 215, 106, 0.8) 25%,
          rgba(255, 215, 106, 0.12) 60%,
          transparent 72%
        );

        filter: blur(2px);

        opacity: 0.75;

        animation: sunFloat 8s ease-in-out infinite;
      }

      @keyframes sunFloat {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }

        50% {
          transform: translateY(-18px) scale(1.04);
        }
      }

      /* =====================================================
           CLOUD SYSTEM
        ===================================================== */

      .cloud {
        position: absolute;

        width: 360px;

        height: 110px;

        border-radius: 100px;

        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.95),
          rgba(224, 241, 255, 0.7)
        );

        filter: blur(1px) drop-shadow(0 30px 30px rgba(0, 25, 70, 0.2));

        opacity: 0.62;

        transform-style: preserve-3d;

        animation: cloudFloat 14s ease-in-out infinite;
      }

      .cloud::before,
      .cloud::after {
        content: "";

        position: absolute;

        border-radius: 50%;

        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.98),
          rgba(225, 242, 255, 0.75)
        );
      }

      .cloud::before {
        width: 150px;
        height: 150px;

        left: 55px;
        bottom: 25px;
      }

      .cloud::after {
        width: 115px;
        height: 115px;

        right: 65px;
        bottom: 20px;
      }

      .cloud-one {
        top: 14%;
        left: -90px;

        transform: scale(0.9) translateZ(-100px);
      }

      .cloud-two {
        right: -120px;
        bottom: 10%;

        transform: scale(1.25) translateZ(-150px);

        opacity: 0.42;

        animation-delay: -5s;
      }

      .cloud-three {
        left: 15%;
        bottom: -50px;

        transform: scale(0.65) translateZ(-250px);

        opacity: 0.22;

        animation-delay: -9s;
      }

      @keyframes cloudFloat {
        0%,
        100% {
          margin-left: 0;
          margin-top: 0;
        }

        50% {
          margin-left: 30px;
          margin-top: -18px;
        }
      }

      /* =====================================================
           FLOATING PARTICLES
        ===================================================== */

      .particle {
        position: absolute;

        width: 4px;
        height: 4px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.65);

        box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);

        animation: particleFloat var(--duration) ease-in-out infinite;
      }

      @keyframes particleFloat {
        0%,
        100% {
          transform: translate3d(0, 0, 0);

          opacity: 0.2;
        }

        50% {
          transform: translate3d(var(--x), -70px, 0);

          opacity: 0.8;
        }
      }

      /* =====================================================
           MAIN
        ===================================================== */

      .container {
        position: relative;

        z-index: 10;

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 30px;
      }

      /* =====================================================
           QUOTE CARD
        ===================================================== */

      .quote-card {
        position: relative;

        width: min(820px, 100%);

        padding: 70px 75px;

        border: 1px solid var(--border);

        border-radius: 34px;

        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.16),
          rgba(255, 255, 255, 0.055)
        );

        backdrop-filter: blur(24px) saturate(125%);

        -webkit-backdrop-filter: blur(24px) saturate(125%);

        box-shadow:
          0 50px 100px rgba(0, 15, 50, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.25),
          inset 0 -1px 0 rgba(0, 20, 60, 0.15);

        transform-style: preserve-3d;

        animation: cardFloat 7s ease-in-out infinite;

        transition: transform 0.15s ease-out;
      }

      @keyframes cardFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-10px);
        }
      }

      /* Card glow */

      .quote-card::before {
        content: "";

        position: absolute;

        inset: 1px;

        border-radius: 33px;

        background: radial-gradient(
          circle at 30% 0%,
          rgba(255, 255, 255, 0.2),
          transparent 35%
        );

        pointer-events: none;
      }

      /* =====================================================
           TOP LABEL
        ===================================================== */

      .label {
        position: relative;

        display: flex;

        align-items: center;

        gap: 12px;

        margin-bottom: 35px;

        color: rgba(255, 255, 255, 0.62);

        font-size: 11px;

        font-weight: 700;

        letter-spacing: 0.2em;

        text-transform: uppercase;
      }

      .label-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: var(--gold);

        box-shadow: 0 0 18px var(--gold-soft);
      }

      /* =====================================================
           QUOTE
        ===================================================== */

      .quote {
        position: relative;

        max-width: 720px;

        font-size: clamp(2rem, 4vw, 3.6rem);

        line-height: 1.15;

        letter-spacing: -0.045em;

        font-weight: 600;

        color: #ffffff;

        text-wrap: balance;
      }

      .quote-mark {
        position: absolute;

        top: -48px;

        left: -5px;

        color: rgba(255, 215, 106, 0.75);

        font-family: Georgia, serif;

        font-size: 80px;

        line-height: 1;
      }

      /* =====================================================
           AUTHOR
        ===================================================== */

      .author {
        position: relative;

        margin-top: 35px;

        padding-left: 24px;

        color: rgba(255, 255, 255, 0.62);

        font-size: 14px;
      }

      .author::before {
        content: "";

        position: absolute;

        left: 0;

        top: 50%;

        width: 12px;

        height: 1px;

        background: var(--gold);
      }

      /* =====================================================
           ACTION
        ===================================================== */

      .actions {
        position: relative;

        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-top: 55px;

        padding-top: 28px;

        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .hint {
        color: rgba(255, 255, 255, 0.42);

        font-size: 11px;
      }

      .new-quote {
        position: relative;

        display: flex;

        align-items: center;

        gap: 12px;

        padding: 13px 20px;

        border: 1px solid rgba(255, 255, 255, 0.18);

        border-radius: 100px;

        background: rgba(255, 255, 255, 0.08);

        color: white;

        font-size: 12px;

        font-weight: 600;

        cursor: pointer;

        transition:
          transform 0.3s ease,
          background 0.3s ease,
          border-color 0.3s ease;
      }

      .new-quote:hover {
        transform: translateY(-3px);

        background: rgba(255, 255, 255, 0.16);

        border-color: rgba(255, 255, 255, 0.35);
      }

      .arrow {
        color: var(--gold);

        font-size: 16px;

        transition: transform 0.3s ease;
      }

      .new-quote:hover .arrow {
        transform: rotate(90deg);
      }

      /* =====================================================
           LOADING
        ===================================================== */

      .loading {
        opacity: 0.45;

        animation: loadingPulse 1.2s ease-in-out infinite;
      }

      @keyframes loadingPulse {
        0%,
        100% {
          opacity: 0.35;
        }

        50% {
          opacity: 1;
        }
      }

      /* =====================================================
           MOBILE
        ===================================================== */

      @media (max-width: 650px) {
        body {
          overflow: auto;
        }

        .container {
          min-height: 100svh;

          padding: 18px;
        }

        .quote-card {
          padding: 45px 28px;

          border-radius: 25px;
        }

        .quote-card::before {
          border-radius: 24px;
        }

        .quote {
          font-size: clamp(1.8rem, 9vw, 2.5rem);
        }

        .actions {
          align-items: flex-start;

          gap: 20px;

          flex-direction: column;
        }

        .hint {
          display: none;
        }

        .sun {
          right: -80px;
          top: 5%;
        }

        .cloud {
          opacity: 0.35;
        }
      }
    </style>
  </head>

  <body>
    <!-- =====================================================
         ATMOSPHERIC BACKGROUND
    ===================================================== -->

    <div class="scene">
      <div class="sun"></div>

      <div class="horizon"></div>

      <div class="cloud cloud-one"></div>

      <div class="cloud cloud-two"></div>

      <div class="cloud cloud-three"></div>

      <!-- Particles -->

      <div
        class="particle"
        style="left: 12%; top: 35%; --x: 20px; --duration: 5s"
      ></div>

      <div
        class="particle"
        style="left: 78%; top: 28%; --x: -25px; --duration: 7s"
      ></div>

      <div
        class="particle"
        style="left: 66%; top: 70%; --x: 15px; --duration: 6s"
      ></div>

      <div
        class="particle"
        style="left: 25%; top: 72%; --x: -15px; --duration: 8s"
      ></div>
    </div>

    <!-- =====================================================
         QUOTE
    ===================================================== -->

    <main class="container">
      <section class="quote-card" id="quoteCard">
        <div class="label">
          <span class="label-dot"></span>

          Daily Perspective
        </div>

        <div class="quote" id="quote">
          <span class="quote-mark"> “ </span>

          Loading inspiration...
        </div>

        <div class="author" id="author">—</div>

        <div class="actions">
          <span class="hint">
            A little perspective can change everything.
          </span>

          <button class="new-quote" id="newQuote">
            New thought

            <span class="arrow"> → </span>
          </button>
        </div>
      </section>
    </main>

    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>
      /* =================================================
           ELEMENTS
        ================================================= */

      const quoteElement = document.getElementById("quote");

      const authorElement = document.getElementById("author");

      const button = document.getElementById("newQuote");

      const card = document.getElementById("quoteCard");

      /* =================================================
           QUOTE API
        ================================================= */

      async function getQuote() {
        quoteElement.classList.add("loading");

        quoteElement.innerHTML =
          '<span class="quote-mark">“</span>Loading inspiration...';

        authorElement.textContent = "—";

        try {
          const response = await fetch(
            "https://quoteslate.vercel.app/api/quotes/random",
          );

          if (!response.ok) {
            throw new Error("API request failed: " + response.status);
          }

          const data = await response.json();

          console.log("API response:", data);

          const quote = Array.isArray(data) ? data[0] : data;

          quoteElement.innerHTML =
            '<span class="quote-mark">“</span>' + escapeHTML(quote.quote);

          authorElement.textContent = "— " + escapeHTML(quote.author);
        } catch (error) {
          console.error("Quote API error:", error);

          quoteElement.innerHTML =
            '<span class="quote-mark">“</span>' +
            "Your future is created by what you do today.";

          authorElement.textContent = "— Robert Kiyosaki";
        } finally {
          quoteElement.classList.remove("loading");
        }
      }

      /* =================================================
           BASIC HTML ESCAPE
        ================================================= */

      function escapeHTML(text) {
        const div = document.createElement("div");

        div.textContent = text ?? "";

        return div.innerHTML;
      }

      /* =================================================
           BUTTON
        ================================================= */

      button.addEventListener("click", getQuote);

      /* =================================================
           3D CARD PARALLAX
        ================================================= */

      document.addEventListener("mousemove", (event) => {
        const x = event.clientX / window.innerWidth;

        const y = event.clientY / window.innerHeight;

        const rotateX = (0.5 - y) * 4;

        const rotateY = (x - 0.5) * 5;

        card.style.transform = `rotateX(${rotateX}deg)
                     rotateY(${rotateY}deg)
                     translateY(-4px)`;
      });

      /* =================================================
           RESET CARD
        ================================================= */

      document.addEventListener("mouseleave", () => {
        card.style.transform = "rotateX(0deg) rotateY(0deg)";
      });

      /* =================================================
           INITIAL QUOTE
        ================================================= */

      getQuote();
    </script>
  </body>
</html>
