<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Local AI</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f5f4ef;
        --surface: rgba(255, 255, 255, 0.62);
        --surface-solid: #ffffff;
        --surface-soft: rgba(255, 255, 255, 0.45);

        --text: #34343a;
        --muted: #92929a;

        --border: rgba(70, 70, 80, 0.1);

        --purple: #8f82c8;
        --purple-soft: #eeeaf9;

        --user: #e8e3f5;
        --assistant: rgba(255, 255, 255, 0.78);

        --shadow: 0 12px 40px rgba(80, 70, 90, 0.08);
      }

      /* =========================
   BODY
========================= */

      body {
        min-height: 100vh;

        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        color: var(--text);

        background:
          radial-gradient(
            circle at 15% 10%,
            rgba(206, 195, 237, 0.45),
            transparent 30%
          ),
          radial-gradient(
            circle at 85% 15%,
            rgba(202, 224, 226, 0.45),
            transparent 30%
          ),
          radial-gradient(
            circle at 50% 100%,
            rgba(235, 220, 197, 0.35),
            transparent 35%
          ),
          var(--bg);

        overflow: hidden;
      }

      /* =========================
   APP
========================= */

      .app {
        height: 100vh;

        display: grid;

        grid-template-columns:
          250px
          minmax(0, 1fr)
          250px;

        transition: grid-template-columns 0.3s ease;
      }

      /* =========================
   COLLAPSED STATES
========================= */

      .app.left-collapsed {
        grid-template-columns:
          70px
          minmax(0, 1fr)
          250px;
      }

      .app.right-collapsed {
        grid-template-columns:
          250px
          minmax(0, 1fr)
          70px;
      }

      .app.left-collapsed.right-collapsed {
        grid-template-columns:
          70px
          minmax(0, 1fr)
          70px;
      }

      /* =========================
   PANELS
========================= */

      .sidebar,
      .settings {
        background: rgba(255, 255, 255, 0.42);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        border-color: var(--border);

        transition:
          padding 0.3s ease,
          opacity 0.25s ease;
      }

      /* =========================
   LEFT SIDEBAR
========================= */

      .sidebar {
        border-right: 1px solid var(--border);

        padding: 22px;

        display: flex;

        flex-direction: column;

        overflow: hidden;
      }

      .left-collapsed .sidebar {
        padding: 18px 12px;
      }

      /* =========================
   LOGO
========================= */

      .logo {
        display: flex;

        align-items: center;

        gap: 11px;

        margin-bottom: 32px;

        white-space: nowrap;
      }

      .logo-icon {
        width: 38px;
        height: 38px;

        min-width: 38px;

        border-radius: 14px;

        display: grid;

        place-items: center;

        background: linear-gradient(135deg, #aaa0d8, #9ac7c5);

        color: white;

        box-shadow: 0 8px 25px rgba(130, 120, 170, 0.2);
      }

      .logo h1 {
        font-size: 15px;

        font-weight: 600;
      }

      .logo span {
        display: block;

        margin-top: 3px;

        color: var(--muted);

        font-size: 10px;
      }

      /* =========================
   COLLAPSE BUTTON
========================= */

      .collapse-btn {
        position: absolute;

        width: 30px;
        height: 30px;

        border-radius: 50%;

        border: 1px solid var(--border);

        background: rgba(255, 255, 255, 0.8);

        color: var(--muted);

        cursor: pointer;

        display: grid;

        place-items: center;

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);

        z-index: 10;
      }

      .left-toggle {
        left: 235px;

        top: 22px;
      }

      .right-toggle {
        right: 235px;

        top: 22px;
      }

      /* =========================
   COLLAPSED CONTENT
========================= */

      .left-collapsed .logo h1,
      .left-collapsed .logo span,
      .left-collapsed .new-chat span,
      .left-collapsed .section-title,
      .left-collapsed .status-text {
        display: none;
      }

      .left-collapsed .logo {
        justify-content: center;
      }

      .left-collapsed .new-chat {
        justify-content: center;
      }

      .left-collapsed .status {
        justify-content: center;
      }

      /* =========================
   BUTTONS
========================= */

      .new-chat {
        width: 100%;

        border: 1px solid var(--border);

        background: rgba(255, 255, 255, 0.55);

        color: var(--text);

        padding: 11px 13px;

        border-radius: 12px;

        cursor: pointer;

        text-align: left;

        transition: 0.2s;

        margin-bottom: 30px;

        display: flex;

        align-items: center;

        gap: 8px;

        white-space: nowrap;
      }

      .new-chat:hover {
        background: white;

        box-shadow: var(--shadow);
      }

      /* =========================
   SECTION TITLE
========================= */

      .section-title {
        color: var(--muted);

        font-size: 10px;

        text-transform: uppercase;

        letter-spacing: 1.4px;

        margin-bottom: 12px;
      }

      /* =========================
   STATUS
========================= */

      .status {
        padding: 12px;

        border: 1px solid var(--border);

        border-radius: 13px;

        background: rgba(255, 255, 255, 0.35);
      }

      .status-row {
        display: flex;

        align-items: center;

        gap: 8px;

        font-size: 12px;
      }

      .dot {
        width: 7px;
        height: 7px;

        background: #79b89b;

        border-radius: 50%;

        box-shadow: 0 0 10px rgba(121, 184, 155, 0.6);
      }

      .status small {
        display: block;

        color: var(--muted);

        margin-top: 7px;

        font-size: 10px;
      }

      /* =========================
   MAIN
========================= */

      .main {
        min-width: 0;

        display: flex;

        flex-direction: column;

        position: relative;
      }

      /* =========================
   TOP BAR
========================= */

      .topbar {
        height: 68px;

        border-bottom: 1px solid var(--border);

        display: flex;

        align-items: center;

        justify-content: space-between;

        padding: 0 28px;

        background: rgba(255, 255, 255, 0.3);

        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
      }

      .model-info {
        display: flex;

        align-items: center;

        gap: 10px;
      }

      .model-badge {
        padding: 5px 9px;

        border-radius: 7px;

        background: var(--purple-soft);

        color: #8176b2;

        font-size: 9px;

        letter-spacing: 0.8px;

        font-weight: 600;
      }

      .model-name {
        font-size: 13px;

        font-weight: 600;
      }

      .model-sub {
        color: var(--muted);

        font-size: 10px;

        margin-top: 2px;
      }

      /* =========================
   CHAT
========================= */

      .chat {
        flex: 1;

        overflow-y: auto;

        padding: 40px 7% 30px;

        scroll-behavior: smooth;
      }

      /* =========================
   WELCOME
========================= */

      .welcome {
        max-width: 650px;

        margin: 12vh auto 0;

        text-align: center;
      }

      .welcome-orb {
        width: 72px;
        height: 72px;

        margin: 0 auto 23px;

        border-radius: 24px;

        background:
          radial-gradient(circle at 30% 25%, #e0d9f5, transparent 28%),
          linear-gradient(135deg, #a69bd0, #a8c9c5);

        box-shadow: 0 15px 40px rgba(130, 120, 170, 0.18);

        animation: float 5s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-7px);
        }
      }

      .welcome h2 {
        font-size: 30px;

        font-weight: 500;

        letter-spacing: -1px;

        margin-bottom: 9px;
      }

      .welcome p {
        color: var(--muted);

        font-size: 13px;

        line-height: 1.7;
      }

      /* =========================
   SUGGESTIONS
========================= */

      .suggestions {
        display: grid;

        grid-template-columns: repeat(2, 1fr);

        gap: 10px;

        margin-top: 28px;
      }

      .suggestion {
        text-align: left;

        padding: 14px;

        border-radius: 14px;

        border: 1px solid var(--border);

        background: rgba(255, 255, 255, 0.45);

        color: var(--text);

        cursor: pointer;

        transition: 0.2s;
      }

      .suggestion:hover {
        transform: translateY(-2px);

        background: rgba(255, 255, 255, 0.8);

        box-shadow: var(--shadow);
      }

      .suggestion strong {
        display: block;

        font-size: 11px;

        margin-bottom: 4px;
      }

      .suggestion span {
        color: var(--muted);

        font-size: 10px;
      }

      /* =========================
   MESSAGES
========================= */

      .message {
        max-width: 850px;

        margin: 0 auto 25px;

        display: flex;

        gap: 10px;

        animation: appear 0.25s ease;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* USER = RIGHT */

      .message.user {
        justify-content: flex-end;
      }

      /* AI = LEFT */

      .message.ai {
        justify-content: flex-start;
      }

      /* =========================
   AVATAR
========================= */

      .avatar {
        width: 29px;
        height: 29px;

        min-width: 29px;

        border-radius: 10px;

        display: grid;

        place-items: center;

        font-size: 8px;

        font-weight: 700;
      }

      .message.user .avatar {
        order: 2;

        background: #ded8ef;

        color: #766ca0;
      }

      .message.ai .avatar {
        background: linear-gradient(135deg, #aaa0d5, #9fc3c1);

        color: white;
      }

      /* =========================
   BUBBLE
========================= */

      .bubble {
        max-width: 70%;

        padding: 12px 15px;

        border-radius: 16px;

        font-size: 13px;

        line-height: 1.65;

        white-space: pre-wrap;
      }

      .message.user .bubble {
        background: var(--user);

        border-bottom-right-radius: 5px;
      }

      .message.ai .bubble {
        background: var(--assistant);

        border: 1px solid var(--border);

        border-bottom-left-radius: 5px;

        box-shadow: 0 5px 20px rgba(80, 70, 90, 0.035);
      }

      /* =========================
   COMPOSER
========================= */

      .composer-area {
        padding: 12px 7% 25px;

        background: linear-gradient(transparent, rgba(245, 244, 239, 0.85) 35%);
      }

      .composer {
        max-width: 850px;

        margin: 0 auto;

        border: 1px solid var(--border);

        background: rgba(255, 255, 255, 0.72);

        border-radius: 18px;

        padding: 9px;

        display: flex;

        align-items: flex-end;

        gap: 8px;

        box-shadow: 0 10px 35px rgba(80, 70, 90, 0.07);

        transition: 0.2s;
      }

      .composer:focus-within {
        border-color: rgba(143, 130, 200, 0.35);

        box-shadow:
          0 0 0 3px rgba(143, 130, 200, 0.06),
          0 12px 40px rgba(80, 70, 90, 0.08);
      }

      textarea {
        flex: 1;

        resize: none;

        max-height: 150px;

        border: none;

        outline: none;

        background: transparent;

        color: var(--text);

        padding: 9px;

        font: inherit;

        font-size: 13px;

        line-height: 1.5;
      }

      textarea::placeholder {
        color: #aaa9b0;
      }

      .send {
        width: 39px;
        height: 39px;

        border: none;

        border-radius: 12px;

        background: linear-gradient(135deg, #aaa0d2, #91bcb9);

        color: white;

        cursor: pointer;

        font-size: 17px;

        transition: 0.2s;
      }

      .send:hover {
        transform: translateY(-1px);

        box-shadow: 0 6px 20px rgba(130, 120, 170, 0.25);
      }

      .send:disabled {
        opacity: 0.45;

        cursor: not-allowed;
      }

      .hint {
        max-width: 850px;

        margin: 8px auto 0;

        color: #aaa8ae;

        font-size: 9px;

        text-align: center;
      }

      /* =========================
   RIGHT SETTINGS
========================= */

      .settings {
        border-left: 1px solid var(--border);

        padding: 24px 20px;

        overflow: hidden;
      }

      .right-collapsed .settings {
        padding: 24px 10px;
      }

      .right-collapsed .settings > *:not(.right-toggle) {
        opacity: 0;

        pointer-events: none;
      }

      .setting {
        margin-bottom: 25px;
      }

      .setting-header {
        display: flex;

        justify-content: space-between;

        margin-bottom: 9px;
      }

      .setting label {
        font-size: 11px;
      }

      .value {
        color: #8176b2;

        font-size: 10px;
      }

      select {
        width: 100%;

        background: rgba(255, 255, 255, 0.65);

        color: var(--text);

        border: 1px solid var(--border);

        border-radius: 10px;

        padding: 9px;

        outline: none;
      }

      input[type="range"] {
        width: 100%;

        accent-color: var(--purple);
      }

      .danger {
        width: 100%;

        border: 1px solid rgba(190, 100, 100, 0.15);

        background: rgba(190, 100, 100, 0.05);

        color: #b97878;

        border-radius: 10px;

        padding: 9px;

        cursor: pointer;
      }

      /* =========================
   RESPONSIVE
========================= */

      @media (max-width: 1000px) {
        .app {
          grid-template-columns:
            210px
            minmax(0, 1fr);
        }

        .settings {
          display: none;
        }

        .right-toggle {
          display: none;
        }
      }

      @media (max-width: 700px) {
        body {
          overflow: auto;
        }

        .app {
          display: block;

          height: 100vh;
        }

        .sidebar {
          display: none;
        }

        .chat {
          padding: 25px 15px 20px;
        }

        .composer-area {
          padding: 10px 15px 18px;
        }

        .welcome h2 {
          font-size: 25px;
        }

        .suggestions {
          grid-template-columns: 1fr;
        }

        .bubble {
          max-width: 82%;
        }
      }
    </style>
  </head>

  <body>
    <div class="app" id="app">
      <!-- ================= LEFT ================= -->

      <aside class="sidebar">
        <div class="logo">
          <div class="logo-icon">✦</div>

          <div>
            <h1>Local AI</h1>

            <span> quiet little assistant </span>
          </div>
        </div>

        <button class="new-chat" onclick="clearChat()">
          ＋

          <span> New conversation </span>
        </button>

        <div class="section-title">Connection</div>

        <div class="status">
          <div class="status-row">
            <span class="dot"></span>

            <span class="status-text"> Ollama connected </span>
          </div>

          <small class="status-text"> localhost:11434 </small>
        </div>
      </aside>

      <!-- LEFT COLLAPSE -->

      <button
        class="collapse-btn left-toggle"
        onclick="toggleLeft()"
        title="Collapse left panel"
      >
        ‹
      </button>

      <!-- ================= MAIN ================= -->

      <main class="main">
        <header class="topbar">
          <div class="model-info">
            <div class="model-badge">LOCAL</div>

            <div>
              <div class="model-name">Gemma 3 · 1B</div>

              <div class="model-sub">running quietly on your machine</div>
            </div>
          </div>
        </header>

        <!-- CHAT -->

        <section class="chat" id="chat">
          <div class="welcome" id="welcome">
            <div class="welcome-orb"></div>

            <h2>Take your time.</h2>

            <p>A small local AI for curious thoughts, experiments and ideas.</p>

            <div class="suggestions">
              <button
                class="suggestion"
                onclick="
                  useSuggestion('Explain how HTTP works in simple terms.')
                "
              >
                <strong> 🌿 Learn something </strong>

                <span> Explain HTTP simply </span>
              </button>

              <button
                class="suggestion"
                onclick="
                  useSuggestion(
                    'Give me a creative project idea using HTML, CSS and JavaScript.',
                  )
                "
              >
                <strong> ✨ Get inspired </strong>

                <span> Find a creative project </span>
              </button>

              <button
                class="suggestion"
                onclick="
                  useSuggestion(
                    'Explain recursion using a simple real-life analogy.',
                  )
                "
              >
                <strong> ☁ Understand </strong>

                <span> Make something easier </span>
              </button>

              <button
                class="suggestion"
                onclick="
                  useSuggestion(
                    'Write a short peaceful motivational quote for a programmer.',
                  )
                "
              >
                <strong> 🌙 Create </strong>

                <span> Make something calm </span>
              </button>
            </div>
          </div>
        </section>

        <!-- COMPOSER -->

        <div class="composer-area">
          <div class="composer">
            <textarea
              id="input"
              rows="1"
              placeholder="Write something..."
              aria-label="Message"
              oninput="autoResize(this)"
              onkeydown="handleKey(event)"
            >
            </textarea>

            <button
              class="send"
              id="sendButton"
              onclick="sendMessage()"
              title="Send message"
            >
              ↑
            </button>
          </div>

          <div class="hint">Enter to send · Shift + Enter for a new line</div>
        </div>
      </main>

      <!-- ================= RIGHT ================= -->

      <aside class="settings">
        <div class="section-title">Quiet controls</div>

        <div class="setting">
          <div class="setting-header">
            <label for="model"> Model </label>
          </div>

          <select id="model" aria-label="Select AI model">
            <option value="gemma3:1b">Gemma 3 · 1B</option>

            <option value="qwen2.5:7b">Qwen 2.5 · 7B</option>

            <option value="qwen2.5-coder:7b">Qwen Coder · 7B</option>
          </select>
        </div>

        <div class="setting">
          <div class="setting-header">
            <label for="temperature"> Creativity </label>

            <span class="value" id="tempValue"> 0.7 </span>
          </div>

          <input
            id="temperature"
            type="range"
            min="0"
            max="2"
            step="0.1"
            value="0.7"
            aria-label="Creativity temperature"
            oninput="updateTemperature()"
          />
        </div>

        <button class="danger" onclick="clearChat()">Clear conversation</button>
      </aside>

      <!-- RIGHT COLLAPSE -->

      <button
        class="collapse-btn right-toggle"
        onclick="toggleRight()"
        title="Collapse settings"
      >
        ›
      </button>
    </div>

    <script>
      /* =========================
   OLLAMA
========================= */

      const OLLAMA_URL = "http://localhost:11434/api/chat";

      /* =========================
   STATE
========================= */

      let messages = [];

      const app = document.getElementById("app");

      const input = document.getElementById("input");

      const chat = document.getElementById("chat");

      const sendButton = document.getElementById("sendButton");

      /* =========================
   PANELS
========================= */

      function toggleLeft() {
        app.classList.toggle("left-collapsed");
      }

      function toggleRight() {
        app.classList.toggle("right-collapsed");
      }

      /* =========================
   INPUT
========================= */

      function autoResize(element) {
        element.style.height = "auto";

        element.style.height = Math.min(element.scrollHeight, 150) + "px";
      }

      function handleKey(event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();

          sendMessage();
        }
      }

      function useSuggestion(text) {
        input.value = text;

        autoResize(input);

        input.focus();
      }

      /* =========================
   TEMPERATURE
========================= */

      function updateTemperature() {
        const value = document.getElementById("temperature").value;

        document.getElementById("tempValue").textContent = value;
      }

      /* =========================
   ADD MESSAGE
========================= */

      function addMessage(role, content) {
        const wrapper = document.createElement("div");

        wrapper.className = `message ${role === "user" ? "user" : "ai"}`;

        const avatar = document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent = role === "user" ? "YOU" : "AI";

        const bubble = document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = content;

        wrapper.appendChild(avatar);

        wrapper.appendChild(bubble);

        chat.appendChild(wrapper);

        chat.scrollTop = chat.scrollHeight;

        return bubble;
      }

      /* =========================
   SEND
========================= */

      async function sendMessage() {
        const text = input.value.trim();

        if (!text) return;

        const model = document.getElementById("model").value;

        const temperature = Number(
          document.getElementById("temperature").value,
        );

        /* USER MESSAGE */

        addMessage("user", text);

        messages.push({
          role: "user",

          content: text,
        });

        input.value = "";

        autoResize(input);

        sendButton.disabled = true;

        /* AI MESSAGE */

        const aiBubble = addMessage("assistant", "Thinking...");

        try {
          const response = await fetch(OLLAMA_URL, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              model: model,

              messages: messages,

              stream: false,

              options: {
                temperature: temperature,
              },
            }),
          });

          if (!response.ok) {
            throw new Error(`Ollama returned HTTP ${response.status}`);
          }

          const data = await response.json();

          const answer = data.message?.content || "No response received.";

          aiBubble.textContent = answer;

          messages.push({
            role: "assistant",

            content: answer,
          });

          chat.scrollTop = chat.scrollHeight;
        } catch (error) {
          aiBubble.textContent =
            "I couldn't reach Ollama.\n\n" +
            "Make sure Ollama is running.\n\n" +
            "Error: " +
            error.message;
        } finally {
          sendButton.disabled = false;

          input.focus();
        }
      }

      /* =========================
   CLEAR
========================= */

      function clearChat() {
        messages = [];

        chat.innerHTML = `

        <div
            class="welcome"
            id="welcome">

            <div class="welcome-orb"></div>

            <h2>
                Take your time.
            </h2>

            <p>
                A small local AI for curious thoughts,
                experiments and ideas.
            </p>

        </div>

    `;

        input.focus();
      }
    </script>
  </body>
</html>
