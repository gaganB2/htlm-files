<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local AI Lab</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #08090d;
        --panel: rgba(18, 20, 28, 0.82);
        --panel-2: rgba(25, 28, 38, 0.9);
        --border: rgba(255, 255, 255, 0.08);
        --text: #f4f5f7;
        --muted: #8d93a1;
        --accent: #8b5cf6;
        --accent-2: #06b6d4;
        --user: #252936;
        --ai: rgba(139, 92, 246, 0.09);
      }

      body {
        min-height: 100vh;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at 15% 20%,
            rgba(139, 92, 246, 0.15),
            transparent 30%
          ),
          radial-gradient(
            circle at 85% 10%,
            rgba(6, 182, 212, 0.12),
            transparent 28%
          ),
          radial-gradient(
            circle at 50% 100%,
            rgba(139, 92, 246, 0.08),
            transparent 35%
          ),
          var(--bg);
        overflow: hidden;
      }

      .app {
        height: 100vh;
        display: grid;
        grid-template-columns: 260px 1fr 260px;
      }

      /* SIDEBAR */

      .sidebar {
        border-right: 1px solid var(--border);
        background: rgba(8, 9, 13, 0.75);
        backdrop-filter: blur(20px);
        padding: 22px;
        display: flex;
        flex-direction: column;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 35px;
      }

      .logo-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 30px rgba(139, 92, 246, 0.35);
        font-size: 19px;
      }

      .logo h1 {
        font-size: 16px;
        letter-spacing: -0.3px;
      }

      .logo span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }

      .section-title {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 12px;
      }

      .new-chat {
        width: 100%;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 11px 13px;
        border-radius: 10px;
        cursor: pointer;
        text-align: left;
        transition: 0.2s;
        margin-bottom: 25px;
      }

      .new-chat:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(139, 92, 246, 0.4);
      }

      .status {
        margin-top: auto;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.025);
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }

      .dot {
        width: 8px;
        height: 8px;
        background: #22c55e;
        border-radius: 50%;
        box-shadow: 0 0 10px #22c55e;
      }

      .status small {
        display: block;
        color: var(--muted);
        margin-top: 7px;
        font-size: 10px;
      }

      /* MAIN */

      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .topbar {
        height: 72px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 25px;
        background: rgba(8, 9, 13, 0.55);
        backdrop-filter: blur(20px);
      }

      .model-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .model-badge {
        padding: 6px 10px;
        border-radius: 7px;
        background: rgba(139, 92, 246, 0.12);
        color: #c4b5fd;
        font-size: 11px;
        border: 1px solid rgba(139, 92, 246, 0.2);
      }

      .model-name {
        font-size: 14px;
        font-weight: 600;
      }

      .model-sub {
        color: var(--muted);
        font-size: 11px;
      }

      .chat {
        flex: 1;
        overflow-y: auto;
        padding: 35px 7%;
        scroll-behavior: smooth;
      }

      .welcome {
        max-width: 650px;
        margin: 11vh auto 0;
        text-align: center;
      }

      .welcome-orb {
        width: 80px;
        height: 80px;
        margin: 0 auto 25px;
        border-radius: 25px;
        background:
          radial-gradient(circle at 30% 30%, #c4b5fd, transparent 25%),
          linear-gradient(135deg, #7c3aed, #0891b2);
        box-shadow:
          0 0 60px rgba(139, 92, 246, 0.25),
          inset 0 0 30px rgba(255, 255, 255, 0.12);
        animation: float 4s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .welcome h2 {
        font-size: 32px;
        letter-spacing: -1px;
        margin-bottom: 10px;
      }

      .welcome p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .suggestions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 30px;
      }

      .suggestion {
        text-align: left;
        padding: 15px;
        border-radius: 13px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.025);
        color: var(--text);
        cursor: pointer;
        transition: 0.2s;
      }

      .suggestion:hover {
        transform: translateY(-2px);
        border-color: rgba(139, 92, 246, 0.4);
        background: rgba(139, 92, 246, 0.07);
      }

      .suggestion strong {
        display: block;
        font-size: 12px;
        margin-bottom: 5px;
      }

      .suggestion span {
        color: var(--muted);
        font-size: 11px;
      }

      .message {
        max-width: 820px;
        margin: 0 auto 24px;
        display: flex;
        gap: 12px;
        animation: appear 0.25s ease;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .avatar {
        width: 30px;
        height: 30px;
        min-width: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
      }

      .message.user .avatar {
        background: #303441;
      }

      .message.ai .avatar {
        background: linear-gradient(135deg, #7c3aed, #0891b2);
      }

      .bubble {
        max-width: calc(100% - 42px);
        padding: 13px 16px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.65;
        white-space: pre-wrap;
      }

      .message.user .bubble {
        background: var(--user);
      }

      .message.ai .bubble {
        background: var(--ai);
        border: 1px solid rgba(139, 92, 246, 0.08);
      }

      /* INPUT */

      .composer-area {
        padding: 15px 7% 25px;
        background: linear-gradient(transparent, rgba(8, 9, 13, 0.95) 30%);
      }

      .composer {
        max-width: 820px;
        margin: 0 auto;
        border: 1px solid var(--border);
        background: rgba(20, 22, 30, 0.9);
        border-radius: 17px;
        padding: 10px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        box-shadow: 0 10px 50px rgba(0, 0, 0, 0.25);
        transition: 0.2s;
      }

      .composer:focus-within {
        border-color: rgba(139, 92, 246, 0.45);
        box-shadow:
          0 0 0 3px rgba(139, 92, 246, 0.06),
          0 10px 50px rgba(0, 0, 0, 0.3);
      }

      textarea {
        flex: 1;
        resize: none;
        max-height: 150px;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        padding: 9px;
        font: inherit;
        font-size: 14px;
        line-height: 1.5;
      }

      textarea::placeholder {
        color: #626875;
      }

      .send {
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 11px;
        background: linear-gradient(135deg, var(--accent), #6d28d9);
        color: white;
        cursor: pointer;
        font-size: 17px;
        transition: 0.2s;
      }

      .send:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
      }

      .send:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      .hint {
        max-width: 820px;
        margin: 9px auto 0;
        color: #555b67;
        font-size: 10px;
        text-align: center;
      }

      /* RIGHT PANEL */

      .settings {
        border-left: 1px solid var(--border);
        background: rgba(8, 9, 13, 0.65);
        backdrop-filter: blur(20px);
        padding: 25px 20px;
      }

      .setting {
        margin-bottom: 25px;
      }

      .setting-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .setting label {
        font-size: 12px;
      }

      .value {
        color: #a78bfa;
        font-size: 11px;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      select {
        width: 100%;
        background: #171923;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px;
        outline: none;
      }

      .danger {
        width: 100%;
        border: 1px solid rgba(239, 68, 68, 0.2);
        background: rgba(239, 68, 68, 0.05);
        color: #fca5a5;
        border-radius: 9px;
        padding: 10px;
        cursor: pointer;
      }

      @media (max-width: 1000px) {
        .app {
          grid-template-columns: 200px 1fr;
        }

        .settings {
          display: none;
        }
      }

      @media (max-width: 700px) {
        .app {
          display: block;
        }

        .sidebar {
          display: none;
        }

        .chat {
          padding: 25px 15px;
        }

        .composer-area {
          padding: 10px 15px 18px;
        }

        .welcome h2 {
          font-size: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <!-- LEFT SIDEBAR -->
      <aside class="sidebar">
        <div class="logo">
          <div class="logo-icon">✦</div>
          <div>
            <h1>Local AI Lab</h1>
            <span>Private · Offline</span>
          </div>
        </div>

        <button class="new-chat" onclick="clearChat()">
          ＋ New conversation
        </button>

        <div class="section-title">Connection</div>

        <div class="status">
          <div class="status-row">
            <span class="dot"></span>
            Ollama connected
          </div>
          <small>localhost:11434</small>
        </div>
      </aside>

      <!-- MAIN CHAT -->
      <main class="main">
        <header class="topbar">
          <div class="model-info">
            <div class="model-badge">LOCAL</div>

            <div>
              <div class="model-name">Gemma 3 · 1B</div>
              <div class="model-sub">Running on your machine</div>
            </div>
          </div>
        </header>

        <section class="chat" id="chat">
          <div class="welcome" id="welcome">
            <div class="welcome-orb"></div>

            <h2>What are you curious about?</h2>

            <p>
              A tiny local AI running directly through Ollama. No cloud. No API
              key. No account.
            </p>

            <div class="suggestions">
              <button
                class="suggestion"
                onclick="
                  useSuggestion('Explain how HTTP works in simple terms.')
                "
              >
                <strong>🌐 Learn something</strong>
                <span>Explain HTTP simply</span>
              </button>

              <button
                class="suggestion"
                onclick="
                  useSuggestion(
                    'Give me a creative project idea using HTML, CSS and JavaScript.',
                  )
                "
              >
                <strong>💡 Get an idea</strong>
                <span>Find a creative project</span>
              </button>

              <button
                class="suggestion"
                onclick="
                  useSuggestion('Explain recursion with a simple analogy.')
                "
              >
                <strong>🧠 Understand</strong>
                <span>Explain a difficult concept</span>
              </button>

              <button
                class="suggestion"
                onclick="
                  useSuggestion(
                    'Write a short motivational quote for a programmer.',
                  )
                "
              >
                <strong>✨ Create</strong>
                <span>Generate something creative</span>
              </button>
            </div>
          </div>
        </section>

        <!-- INPUT -->
        <div class="composer-area">
          <div class="composer">
            <textarea
              id="input"
              rows="1"
              placeholder="Message your local AI..."
              oninput="autoResize(this)"
              onkeydown="handleKey(event)"
            ></textarea>

            <button class="send" id="sendButton" onclick="sendMessage()">
              ↑
            </button>
          </div>

          <div class="hint">Enter to send · Shift + Enter for new line</div>
        </div>
      </main>

      <!-- RIGHT SETTINGS -->
      <aside class="settings">
        <div class="section-title">Model settings</div>

        <div class="setting">
          <div class="setting-header">
            <label>Model</label>
          </div>

          <select id="model">
            <option value="gemma3:1b">Gemma 3 · 1B</option>
            <option value="qwen2.5:7b">Qwen 2.5 · 7B</option>
            <option value="qwen2.5-coder:7b">Qwen 2.5 Coder · 7B</option>
          </select>
        </div>

        <div class="setting">
          <div class="setting-header">
            <label>Temperature</label>
            <span class="value" id="tempValue">0.7</span>
          </div>

          <input
            id="temperature"
            type="range"
            min="0"
            max="2"
            step="0.1"
            value="0.7"
            oninput="updateTemperature()"
          />
        </div>

        <button class="danger" onclick="clearChat()">Clear conversation</button>
      </aside>
    </div>

    <script>
      const OLLAMA_URL = "http://localhost:11434/api/chat";

      let messages = [];

      const input = document.getElementById("input");
      const chat = document.getElementById("chat");
      const sendButton = document.getElementById("sendButton");
      const welcome = document.getElementById("welcome");

      function autoResize(element) {
        element.style.height = "auto";

        element.style.height = Math.min(element.scrollHeight, 150) + "px";
      }

      function handleKey(event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();

          sendMessage();
        }
      }

      function useSuggestion(text) {
        input.value = text;

        autoResize(input);

        input.focus();
      }

      function updateTemperature() {
        const value = document.getElementById("temperature").value;

        document.getElementById("tempValue").textContent = value;
      }

      function addMessage(role, content) {
        if (welcome) {
          welcome.style.display = "none";
        }

        const wrapper = document.createElement("div");

        wrapper.className = `message ${role === "user" ? "user" : "ai"}`;

        const avatar = document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent = role === "user" ? "YOU" : "AI";

        const bubble = document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = content;

        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);

        chat.appendChild(wrapper);

        chat.scrollTop = chat.scrollHeight;

        return bubble;
      }

      async function sendMessage() {
        const text = input.value.trim();

        if (!text) return;

        const model = document.getElementById("model").value;

        const temperature = Number(
          document.getElementById("temperature").value,
        );

        addMessage("user", text);

        messages.push({
          role: "user",
          content: text,
        });

        input.value = "";

        autoResize(input);

        sendButton.disabled = true;

        const aiBubble = addMessage("assistant", "Thinking...");

        try {
          const response = await fetch(OLLAMA_URL, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              model: model,

              messages: messages,

              stream: false,

              options: {
                temperature: temperature,
              },
            }),
          });

          if (!response.ok) {
            throw new Error(`Ollama returned HTTP ${response.status}`);
          }

          const data = await response.json();

          const answer = data.message?.content || "No response received.";

          aiBubble.textContent = answer;

          messages.push({
            role: "assistant",
            content: answer,
          });
        } catch (error) {
          aiBubble.textContent =
            "Could not connect to Ollama.\n\n" +
            "Make sure Ollama is running and that " +
            "http://localhost:11434 is available.\n\n" +
            "Error: " +
            error.message;
        } finally {
          sendButton.disabled = false;

          input.focus();
        }
      }

      function clearChat() {
        messages = [];

        chat.innerHTML = "";

        const newWelcome = document.createElement("div");

        newWelcome.className = "welcome";

        newWelcome.innerHTML = `
        <div class="welcome-orb"></div>

        <h2>What are you curious about?</h2>

        <p>
            A tiny local AI running directly through Ollama.
            No cloud. No API key. No account.
        </p>

        <div class="suggestions">

            <button class="suggestion"
                onclick="useSuggestion('Explain how HTTP works in simple terms.')">
                <strong>🌐 Learn something</strong>
                <span>Explain HTTP simply</span>
            </button>

            <button class="suggestion"
                onclick="useSuggestion('Give me a creative project idea using HTML, CSS and JavaScript.')">
                <strong>💡 Get an idea</strong>
                <span>Find a creative project</span>
            </button>

            <button class="suggestion"
                onclick="useSuggestion('Explain recursion with a simple analogy.')">
                <strong>🧠 Understand</strong>
                <span>Explain a difficult concept</span>
            </button>

            <button class="suggestion"
                onclick="useSuggestion('Write a short motivational quote for a programmer.')">
                <strong>✨ Create</strong>
                <span>Generate something creative</span>
            </button>

        </div>
    `;

        chat.appendChild(newWelcome);

        input.focus();
      }
    </script>
  </body>
</html>
